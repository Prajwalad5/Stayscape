version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: stayscape-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: stayscape_app
      POSTGRES_PASSWORD: stayscape_password_dev
      POSTGRES_DB: stayscape
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stayscape_app -d stayscape"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
